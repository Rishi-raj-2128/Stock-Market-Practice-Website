name: Verify Java backend and React frontend

on:
  push:
    branches: [main, "feature/java-spring-boot-backend"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Java 17 / Spring Boot build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile and run backend tests
        run: mvn -B -f backend/pom.xml verify

  frontend:
    name: React / TypeScript production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
